name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core

      - name: Create local .env from template
        run: |
          cp .env.example .env
          printf '\nDB_PASSWORD=ci-password\nSECRET_KEY=ci-secret-key\nGRAFANA_ADMIN_PASSWORD=ci-grafana-password\n' >> .env

      - name: Run repo validation
        run: make validate

      - name: Validate smoke-test script syntax
        run: bash -n scripts/smoke-test.sh
