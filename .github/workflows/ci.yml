name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validation:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Install kubectl
        run: |
          curl -fsSL -o /tmp/kubectl "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          install -o root -g root -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          kubectl version --client --output=yaml

      - name: Install Ansible
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ansible-core

      - name: Create local .env from template
        run: |
          cp .env.example .env
          printf '\nDB_PASSWORD=ci-password\nSECRET_KEY=ci-secret-key\nGRAFANA_ADMIN_PASSWORD=ci-grafana-password\n' >> .env

      - name: Run repo validation
        run: make validate

      - name: Validate smoke-test script syntax
        run: bash -n scripts/smoke-test.sh
