apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: api-deployment-demo
  labels:
    app: api-demo
    component: api
spec:
  selector:
    app: api-demo
    component: api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30800
  type: NodePort

---
# Service alias for Nginx compatibility
# Nginx config expects to resolve "api:8000"
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: api-deployment-demo
  labels:
    app: api-demo
    component: api
spec:
  selector:
    app: api-demo
    component: api
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
