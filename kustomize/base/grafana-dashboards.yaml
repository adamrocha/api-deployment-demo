# Grafana Dashboards ConfigMaps
# These ConfigMaps contain the JSON dashboard definitions

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-api-performance
  namespace: api-deployment-demo-ns
data:
  api-performance.json: |
    {
      "dashboard": {
        "title": "API Performance",
