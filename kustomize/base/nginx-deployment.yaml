apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: api-deployment-demo
  labels:
    app: api-demo
    component: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-demo
      component: nginx
  template:
    metadata:
      labels:
        app: api-demo
        component: nginx
    spec:
      securityContext:
        runAsNonRoot: false
        fsGroup: 101

      containers:
        - name: nginx
          image: api-deployment-demo-nginx:latest
          imagePullPolicy: Never # Use local images in Kind
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8443
              name: https
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: ssl-certs
              mountPath: /etc/nginx/ssl
              readOnly: true
            - name: nginx-html
              mountPath: /usr/share/nginx/html
              readOnly: true
          resources:
            requests:
              memory: 64Mi
              cpu: 100m
            limits:
              memory: 128Mi
              cpu: 200m
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsUser: 10001
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL

        # Nginx Prometheus Exporter Sidecar
        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:latest
          args:
            - --nginx.scrape-uri=http://localhost:8080/stub_status
          ports:
            - containerPort: 9113
              name: metrics
          resources:
            requests:
              memory: 32Mi
              cpu: 50m
            limits:
              memory: 64Mi
              cpu: 100m

      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
            items:
              - key: nginx.conf
                path: default.conf
              - key: common-config.conf
                path: common-config.conf
        - name: ssl-certs
          secret:
            secretName: nginx-ssl-certs
            optional: true
        - name: nginx-html
          configMap:
            name: nginx-html
