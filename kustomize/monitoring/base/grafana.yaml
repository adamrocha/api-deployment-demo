apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: api-deployment-demo-ns
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:12.4.2@sha256:e2866546bf00a3c5a0ac9f4ec0b97ba8cbacc71f205065682615e5bc347a0da9
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - NET_RAW
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-secret
                  key: admin-password
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
          volumeMounts:
            - name: dashboards-provisioning
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard-api-performance
              mountPath: /var/lib/grafana/dashboards/api-performance.json
              subPath: api-performance.json
            - name: dashboard-infrastructure
              mountPath: /var/lib/grafana/dashboards/infrastructure.json
              subPath: infrastructure.json
            - name: dashboard-database
              mountPath: /var/lib/grafana/dashboards/database.json
              subPath: database.json
            - name: dashboard-nginx-traffic
              mountPath: /var/lib/grafana/dashboards/nginx-traffic.json
              subPath: nginx-traffic.json
            - name: datasource-provisioning
              mountPath: /etc/grafana/provisioning/datasources
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 250m
      volumes:
        - name: dashboards-provisioning
          configMap:
            name: grafana-dashboards-provisioning
        - name: dashboard-api-performance
          configMap:
            name: grafana-dashboard-api-performance
        - name: dashboard-infrastructure
          configMap:
            name: grafana-dashboard-infrastructure
        - name: dashboard-database
          configMap:
            name: grafana-dashboard-database
        - name: dashboard-nginx-traffic
          configMap:
            name: grafana-dashboard-nginx-traffic
        - name: datasource-provisioning
          configMap:
            name: grafana-datasource-provisioning

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: api-deployment-demo-ns
  labels:
    app: grafana
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300
  type: NodePort
