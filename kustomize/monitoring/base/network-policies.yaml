# NetworkPolicy for Grafana
# Allows:
# - Ingress from any source on port 3000 (for user access via NodePort)
# - Egress to Prometheus for querying metrics
# - Egress to DNS for name resolution
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-network-policy
  namespace: api-deployment-demo-ns
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow access to Grafana UI from anywhere (via NodePort)
    - from: []
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # Allow Grafana to query Prometheus
    - to:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 9090
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # Allow Grafana's grafana-apiserver module to reach the Kubernetes API
    # (needed for delegated authentication / TokenReview calls in Grafana 12.x)
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443

---
# NetworkPolicy for Prometheus
# Allows:
# - Ingress from Grafana for queries
# - Egress to kube-state-metrics for scraping
# - Egress to api-deployment-demo-ns for scraping application metrics
# - Egress to DNS for service discovery
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-network-policy
  namespace: api-deployment-demo-ns
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow Grafana to query Prometheus
    - from:
        - podSelector:
            matchLabels:
              app: grafana
      ports:
        - protocol: TCP
          port: 9090
    # Allow external access via NodePort
    - from: []
      ports:
        - protocol: TCP
          port: 9090
  egress:
    # Allow Prometheus to scrape kube-state-metrics
    - to:
        - podSelector:
            matchLabels:
              app: kube-state-metrics
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
    # Allow Prometheus to scrape application pods in api-deployment-demo-ns
    - to:
        - namespaceSelector:
            matchLabels:
              name: api-deployment-demo
      ports:
        - protocol: TCP
          port: 8000 # API metrics
        - protocol: TCP
          port: 9113 # Nginx exporter
        - protocol: TCP
          port: 9187 # Postgres exporter
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # Allow Kubernetes API access for service discovery (API server service)
    - to:
        - podSelector: {}
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
      ports:
        - protocol: TCP
          port: 443
    # Allow Kubernetes API server access (control plane)
    - ports:
        - protocol: TCP
          port: 6443

---
# NetworkPolicy for kube-state-metrics
# Allows:
# - Ingress from Prometheus for scraping
# - Egress to Kubernetes API for metrics collection
# - Egress to DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kube-state-metrics-network-policy
  namespace: api-deployment-demo-ns
spec:
  podSelector:
    matchLabels:
      app: kube-state-metrics
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow Prometheus to scrape metrics
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # Allow access to Kubernetes API server (ClusterIP and direct node access).
    # kube-state-metrics reaches the API via the kubernetes ClusterIP (10.96.0.1:443)
    # which is a virtual IP and cannot be matched by pod/namespace selectors.
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
