apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production monitoring namespace: api-monitoring-ns
namespace: api-monitoring-ns

resources:
  - ../../base
  - namespace.yaml

labels:
  - pairs:
      environment: production

# Grafana admin secret for production (generated by scripts/generate-kustomize-secrets.sh)
secretGenerator:
  - name: grafana-admin-secret
    envs:
      - grafana-secrets.env
