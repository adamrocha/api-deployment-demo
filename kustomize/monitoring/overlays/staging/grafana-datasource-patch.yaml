apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-provisioning
  namespace: api-monitoring-staging-ns
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.api-monitoring-staging-ns.svc.cluster.local:9090
        isDefault: true
        editable: true
