apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Staging monitoring namespace: api-monitoring-staging-ns
namespace: api-monitoring-staging-ns

resources:
  - ../../base
  - namespace.yaml

labels:
  - pairs:
      environment: staging

# Patch staging-specific values into monitoring configs
patches:
  # Update app scrape namespace and kube-state-metrics target for staging
  - path: prometheus-config-patch.yaml
    target:
      kind: ConfigMap
      name: prometheus-config
  # Point Grafana datasource at the staging monitoring namespace Prometheus
  - path: grafana-datasource-patch.yaml
    target:
      kind: ConfigMap
      name: grafana-datasource-provisioning

# Grafana admin secret for staging (generated by scripts/generate-kustomize-secrets.sh)
secretGenerator:
  - name: grafana-admin-secret
    envs:
      - grafana-secrets.env
