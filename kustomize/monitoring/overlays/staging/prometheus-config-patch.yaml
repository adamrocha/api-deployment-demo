apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'api'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - api-deployment-demo-staging-ns
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: api-demo
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_component]
            regex: api
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            regex: (.+)
            target_label: __address__
            replacement: ${1}:8000
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace

      - job_name: 'postgres-exporter'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - api-deployment-demo-staging-ns
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: postgres
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            regex: (.+)
            target_label: __address__
            replacement: ${1}:9187
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace

      - job_name: 'nginx-exporter'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - api-deployment-demo-staging-ns
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: api-demo
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_component]
            regex: nginx
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            regex: (.+)
            target_label: __address__
            replacement: ${1}:9113
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace

      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics.api-monitoring-staging-ns.svc.cluster.local:8080']
