apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Staging overlay
namespace: api-deployment-demo-staging-ns

resources:
  - ../../base

# Staging-specific labels
labels:
  - pairs:
      environment: staging
      deployment-method: kustomize

namePrefix: staging-

# Reduced replica counts for staging
replicas:
  - name: api-deployment
    count: 1
  - name: nginx-deployment
    count: 1
  - name: postgres
    count: 1

# Lower resource limits for staging
patches:
  - target:
      kind: Deployment
      name: api-deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "500m"

  # Adjust HPA for staging (lower max replicas)
  - target:
      kind: HorizontalPodAutoscaler
      name: api-deployment
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 3

configMapGenerator:
  - name: env-config
    literals:
      - ENVIRONMENT=staging
      - LOG_LEVEL=debug
      - DEBUG=true

# Secrets for staging loaded from local env files generated by scripts/generate-kustomize-secrets.sh
secretGenerator:
  - name: database-credentials
    envs:
      - database-credentials.env

  - name: api-secrets
    envs:
      - api-secrets.env

  - name: grafana-admin-secret
    envs:
      - grafana-secrets.env
